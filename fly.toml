# fly.toml — MOS OFPPT (Laravel + React)
# See https://fly.io/docs/reference/configuration/
#
# ⚠️  Sensitive values (DB password, APP_KEY, etc.) are set via
#     `fly secrets set KEY=val` — DO NOT hardcode them here.
#
# Required secrets :
#   fly secrets set APP_KEY=$(php -r 'echo "base64:".base64_encode(random_bytes(32));')
#   fly secrets set DB_DATABASE=mos_ofppt
#   fly secrets set DB_HOST=<your-fly-mysql-host>
#   fly secrets set DB_PASSWORD=...
#   fly secrets set DB_PORT=3306
#   fly secrets set DB_USERNAME=...
#
# Required build args (set via fly.toml [build.args] or fly deploy --build-arg):
#   VITE_API_URL  → defaults to empty (uses relative /api/v1 paths)

app = 'mos-ofppt'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[build.args]
  VITE_API_URL = ''

[env]
  APP_DEBUG = 'false'
  APP_ENV = 'production'
  APP_LOCALE = 'fr'
  APP_TIMEZONE = 'Africa/Casablanca'
  APP_URL = 'https://mos-ofppt.fly.dev'
  CACHE_DRIVER = 'file'
  CORS_ALLOWED_ORIGINS = 'https://mos-ofppt.fly.dev'
  DB_CONNECTION = 'pgsql'
  FILESYSTEM_DISK = 'local'
  LOG_LEVEL = 'warning'
  MAIL_FROM_ADDRESS = 'noreply@mos-ofppt.ma'
  MAIL_FROM_NAME = 'MOS OFPPT'
  QUEUE_CONNECTION = 'sync'
  SANCTUM_STATEFUL_DOMAINS = 'mos-ofppt.fly.dev'
  SESSION_DRIVER = 'file'

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[deploy]
  release_command = "php artisan migrate --force"

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
