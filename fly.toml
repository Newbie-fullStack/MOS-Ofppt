# fly.toml app configuration file generated for mos-ofppt on 2026-06-07T17:30:30Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mos-ofppt'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  APP_DEBUG = 'false'
  APP_ENV = 'production'
  APP_URL = 'https://mos-ofppt.fly.dev'
  CACHE_DRIVER = 'file'
  CORS_ALLOWED_ORIGINS = 'https://mos-ofppt.fly.dev'
  DB_CONNECTION = 'mysql'
  LOG_LEVEL = 'warning'
  QUEUE_CONNECTION = 'sync'
  SANCTUM_STATEFUL_DOMAINS = 'mos-ofppt.fly.dev'
  SESSION_DRIVER = 'file'

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
