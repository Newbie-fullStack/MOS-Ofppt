# ─────────────────────────────────────────────────────────────
# Fly.io Configuration — MOS OFPPT
# ─────────────────────────────────────────────────────────────
# 
# 📌 Set secrets before first deploy:
#   fly secrets set APP_KEY=$(php artisan key:generate --show)
#   fly secrets set DB_HOST=your-mysql-host
#   fly secrets set DB_DATABASE=mos_ofppt
#   fly secrets set DB_USERNAME=mos_user
#   fly secrets set DB_PASSWORD=your-db-password
#   fly secrets set REDIS_HOST=your-redis-host
#
# 🚀 Deploy:
#   fly deploy
# ─────────────────────────────────────────────────────────────

app = "mos-ofppt"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  APP_URL = "https://mos-ofppt.fly.dev"
  LOG_LEVEL = "warning"
  DB_CONNECTION = "mysql"
  CACHE_DRIVER = "file"
  QUEUE_CONNECTION = "sync"
  SESSION_DRIVER = "file"
  SANCTUM_STATEFUL_DOMAINS = "mos-ofppt.fly.dev"
  CORS_ALLOWED_ORIGINS = "https://mos-ofppt.fly.dev"
